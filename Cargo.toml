[workspace]
resolver = "2"
members = [
    "crates/ngs_ast",
    "crates/ngs_lexer",
    "crates/ngs_parser",
    "crates/ngs_sema",
    "crates/ngs_ir",
    "crates/ngs_codegen_llvm",
    "crates/ngs_codegen_wasm",
    "crates/ngs_std",
    "crates/ngs_driver",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
